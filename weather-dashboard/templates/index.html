<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>e-Paper Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
      background: #f0f0f0;
      color: #222;
    }
    h1 {
      font-size: 1.2em;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }
    .modes {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .modes button {
      flex: 1;
      padding: 12px 8px;
      font-size: 0.95em;
      font-weight: 500;
      border: 2px solid #333;
      background: #fff;
      color: #333;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .modes button:hover {
      background: #e8e8e8;
    }
    .modes button.active {
      background: #333;
      color: #fff;
    }
    .preview-wrap {
      text-align: center;
      margin-bottom: 16px;
    }
    .preview-wrap img {
      border: 2px solid #333;
      border-radius: 4px;
      background: #fff;
      image-rendering: pixelated;
      width: 250px;
      height: 122px;
    }
    .status {
      text-align: center;
      font-size: 0.85em;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>e-Paper Dashboard</h1>

  <div class="modes">
    <button id="btn-weather" onclick="setMode('weather')">Weather</button>
    <button id="btn-clock" onclick="setMode('clock')">Clock</button>
    <button id="btn-facts" onclick="setMode('facts')">Facts</button>
  </div>

  <div class="preview-wrap">
    <img id="preview" src="/api/preview.bmp" alt="Display preview">
  </div>

  <div class="status" id="status">Connecting...</div>

  <script>
    function fetchStatus() {
      fetch("/api/status")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          document.getElementById("status").textContent = "Mode: " + data.mode;
          var btns = document.querySelectorAll(".modes button");
          for (var i = 0; i < btns.length; i++) {
            btns[i].classList.remove("active");
          }
          var active = document.getElementById("btn-" + data.mode);
          if (active) active.classList.add("active");
        })
        .catch(function() {
          document.getElementById("status").textContent = "Connection lost";
        });
    }

    function refreshPreview() {
      document.getElementById("preview").src = "/api/preview.bmp?" + Date.now();
    }

    function setMode(mode) {
      var btns = document.querySelectorAll(".modes button");
      for (var i = 0; i < btns.length; i++) {
        btns[i].disabled = true;
      }
      document.getElementById("status").textContent = "Switching...";

      fetch("/api/mode", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: mode })
      })
        .then(function(r) { return r.json(); })
        .then(function() {
          setTimeout(function() {
            fetchStatus();
            refreshPreview();
            var btns = document.querySelectorAll(".modes button");
            for (var i = 0; i < btns.length; i++) {
              btns[i].disabled = false;
            }
          }, 300);
        })
        .catch(function() {
          document.getElementById("status").textContent = "Error switching mode";
          var btns = document.querySelectorAll(".modes button");
          for (var i = 0; i < btns.length; i++) {
            btns[i].disabled = false;
          }
        });
    }

    fetchStatus();
    refreshPreview();
    setInterval(function() { fetchStatus(); refreshPreview(); }, 10000);
  </script>
</body>
</html>
